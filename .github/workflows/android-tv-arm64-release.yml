name: android-tv-arm-release

on:
  push:
    branches: [ "master", "main", "codex/**" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.TV_KEYSTORE_BASE64 }}" | base64 --decode > tv-release.jks

      - name: Write signing properties
        run: |
          cat <<EOF > signing.properties
          storeFile=../tv-release.jks
          storePassword=${{ secrets.TV_STORE_PASSWORD }}
          keyAlias=${{ secrets.TV_KEY_ALIAS }}
          keyPassword=${{ secrets.TV_KEY_PASSWORD }}
          EOF

      - name: Build
        run: ./gradlew :core:test :app-tv:lint :app-tv:testDebugUnitTest :app-tv:assembleRelease

      - name: Upload arm APKs (v8a + v7a)
        uses: actions/upload-artifact@v4
        with:
          name: live-tv-arm-release
          path: |
            app-tv/build/outputs/apk/release/app-tv-arm64-v8a-release.apk
            app-tv/build/outputs/apk/release/app-tv-armeabi-v7a-release.apk
